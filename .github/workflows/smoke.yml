name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Smoke test
        run: make smoke
      - name: Printed install path (pip install -r requirements.txt)
        run: |
          uv venv --seed --python ${{ matrix.python-version }} /tmp/pipenv
          /tmp/pipenv/bin/python -m pip install -q -r requirements.txt
          /tmp/pipenv/bin/python preprocess.py
          /tmp/pipenv/bin/python fusion_router.py
          /tmp/pipenv/bin/python inference_client.py

  airflow-dag:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: /tmp/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /tmp/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TASK_RETRIES: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install core + Airflow with its constraints file (as in the README)
        run: |
          uv venv --seed --python 3.12 /tmp/afenv
          /tmp/afenv/bin/python -m pip install -q -r requirements.txt
          /tmp/afenv/bin/python -m pip install -q -r requirements-airflow.txt \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
      - name: Run the DAG once (airflow dags test)
        run: |
          mkdir -p "$AIRFLOW__CORE__DAGS_FOLDER"
          ln -s "$PWD/fieldsense_inference_dag.py" "$AIRFLOW__CORE__DAGS_FOLDER/"
          export PATH=/tmp/afenv/bin:$PATH
          airflow db migrate
          airflow dags test fieldsense_inference_router
          test "$(wc -l < output/inference_results.jsonl)" -eq 201
